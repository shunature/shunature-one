<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | SQUARE fractal</title>
  </head>
  <body>
    <div class="theme-toggle-button">テーマ切り替え</div>
    <div class="front-texts">
    <a href="index.html"><h1>SQUARE fractal  <br>Shun "Squlio" Tonegawa</h1></a>
    </div>
    <br>
    <div class="about-texts">
      <h2>このサイトについて</h2>
      <hr>
    <p>どうも、利根川です。<br>
    <b>なぜこのサイトを作ったかと言いますと...</b><br>
    AIにつくってもらうよりも、<br>自分で軽いサイトを作っちゃう方がわかりやすいんじゃないかと思ったからです。<br>
    また、<a href="https://youtu.be/XZnevu5f2N4" target="_blank">AIに作ってもらうポップについての動画</a>見て、こうも思いました。<br>
    <b>情報量多くない？</b>と<br>
    そのため、わかりやすさ重視でVSCodeのコードサジェストで作りました。</p>
    </div>
    <br>
  <footer class="footer">
    <p>© {{ year }} Shun "Squlio" Tonegawa</p>  
  </footer>
  </body>
  <style>
    :root {
      --background-color: #fff;
      --text-color: #000;
      --accent-color: #00ffee;
    }
    body {
      background-color: var(--background-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .p {
      font-size: 1.2em;
      line-height: 3em;
    }
    .h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    .front-texts {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    .front-texts a {
      text-decoration: none;
      color: var(--text-color);
    }
    .front-texts h1:hover {
      color: var(--accent-color);
    }
    .about-texts {
      position: absolute;
      bottom: 100px;
      top: 40%;
      left: 50%;
      transform: translate(-50%);
      text-align: center;
    }
    .about-texts b {
      font-weight: bold;
      color: var(--accent-color);
    }
    .about-texts p {
      font-size: 1.2em;
      line-height: 2em;
    }
    .about-texts a {
      color: var(--text-color);
    }
    .about-texts a:hover {
      text-decoration: underline;
      color: var(--accent-color);
    }
    .footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
    }
    .footer p {
      margin: 10px 0;
    }

    hr {
  border: none;
  border-top: 3px double var(--text-color);
  color: var(--text-color);
  overflow: visible;
  text-align: center;
  height: 5px;
}

hr::after {
  background: var(--background-color);
  content: "§";
  padding: 0 4px;
  position: relative;
  top: -13px;
}

.today {
  position: absolute;
  top: 5px;
  right: 50%;
  transform: translateX(50%);
  font-size: 1em;
  color: var(--text-color);
  text-align: center;
}

    
    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #000;
        --text-color: #fff;
        --accent-color: #ff00ee;
      }
    }

    @media screen and (max-width: 600px) {
      .front-texts {
        top: 20%;
      }
      .mail-introduction {
        top: 60%;
      }
      .links {
        bottom: 30px;
      }
      .footer {
        bottom: 10px;
      }
    }

    .theme-toggle-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 5px 10px;
      background-color: var(--accent-color);
      color: var(--background-color);
      border: none;
      cursor: pointer; 
    }
  </style>
  <script>
    //テーマをボタンでで切り替え
    const themeToggleButton = document.querySelector(".theme-toggle-button");
    themeToggleButton.addEventListener("click", () => {
      const currentTheme = getComputedStyle(document.documentElement).getPropertyValue('--background-color').trim();
      if (currentTheme === '#fff') {
        document.documentElement.style.setProperty('--background-color', '#000');
        document.documentElement.style.setProperty('--text-color', '#fff');
        document.documentElement.style.setProperty('--accent-color', '#ff00ee');
      } else {
        document.documentElement.style.setProperty('--background-color', '#fff');
        document.documentElement.style.setProperty('--text-color', '#000');
        document.documentElement.style.setProperty('--accent-color', '#00ffee');
      }
    });

    const year = new Date().getFullYear();
    document.querySelector(".footer p").textContent = `© ${year} Shun "Squlio" Tonegawa`;
  </script>
</html>
