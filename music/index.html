<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music — Picturebook from shunature</title>
    <meta name="description" content="shunatureが今週聴いている音楽とプレイリスト。">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <style>
        .music-wrap { padding: 3.5rem 0 6rem; }

        .music-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 3rem;
        }

        /* ── Now Playing ── */
        .now-section { margin-bottom: 4.5rem; }
        
        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .section-link {
            font-size: .75rem;
            color: var(--text-subtle);
            text-decoration: none;
            opacity: .6;
            transition: opacity .2s, color .2s;
        }
        .section-link:hover {
            opacity: 1;
            color: var(--accent);
        }

        .now-card {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.4rem 1.6rem;
            background: var(--surface);
            border: 1px solid var(--border-mid);
            border-radius: var(--radius);
            max-width: 480px;
            text-decoration: none;
            color: inherit;
            transition: border-color .2s, transform .2s;
        }
        .now-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .now-art {
            width: 56px; height: 56px;
            border-radius: 2px; object-fit: cover;
            flex-shrink: 0; background: var(--bg2);
        }
        .now-art-ph {
            width: 56px; height: 56px;
            border-radius: 2px; background: var(--bg2);
            flex-shrink: 0; display: flex;
            align-items: center; justify-content: center; opacity: .3;
        }
        .now-info { flex: 1; min-width: 0; }
        .now-track {
            font-size: .95rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .25rem;
        }
        .now-artist {
            font-size: .78rem; color: var(--text-subtle);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-status {
            display: flex; align-items: center; gap: .4rem;
            font-size: .62rem; color: var(--text-subtle);
            margin-top: .4rem; opacity: .7;
            letter-spacing: .06em; text-transform: uppercase;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .4; transform: scale(.7); }
        }
        .now-loading {
            font-size: .8rem; color: var(--text-subtle); opacity: .5; padding: 1rem 0;
        }

        /* ── Playlists ── */
        .playlists-section { margin-top: 3.5rem; }

        .playlists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1px;
            background: var(--border);
            margin-top: 1.2rem;
        }

        .playlist-card {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: background .2s;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
            border: 1px solid var(--border-mid);
        }
        .playlist-card:hover {
            background: var(--bg2);
            border-color: var(--accent);
        }
        
        .playlist-art-wrap {
            aspect-ratio: 1 / 1;
            width: 100%;
            overflow: hidden;
            background: var(--bg2);
        }
        .playlist-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s ease;
        }
        .playlist-card:hover .playlist-art {
            transform: scale(1.05);
        }

        .playlist-content {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: .4rem;
        }

        .playlist-card-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            transition: color .2s;
        }
        .playlist-card:hover .playlist-card-title { color: var(--accent); }

        .playlist-card-desc {
            font-size: .75rem;
            color: var(--text-subtle);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.4rem;
            margin-bottom: .4rem;
        }

        .playlist-card-count {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            background: var(--bg2);
            padding: .2rem .6rem;
            border-radius: 4px;
            font-size: .62rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-subtle);
            border: 1px solid var(--border-mid);
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .now-card { max-width: 100%; }
        }
    </style>
</head>
<body>

<header-module></header-module>

<main>
<div class="music-wrap">
<div class="container">

    <h1 class="music-title">Music</h1>

    <!-- Now Playing -->
    <div class="now-section">
        <div class="section-header">
            <p class="section-label" style="margin-bottom:0;">Now Playing</p>
            <a href="/music/scrobbles/" class="section-link">View history →</a>
        </div>
        <div id="now-wrap">
            <p class="now-loading">読み込み中...</p>
        </div>
    </div>

    <!-- Playlists -->
    <div class="playlists-section">
        <div class="section-header">
            <p class="section-label" style="margin-bottom:0;">Playlists</p>
        </div>
        <div class="playlists-grid" id="playlists-grid">
            <p class="now-loading">読み込み中...</p>
        </div>
    </div>

</div>
</div>
</main>

<script src="/common.js"></script>
<script>
(async function () {
    let key = '', user = '';
    try {
        const cfg = await fetch('/last-config.json').then(r => r.json());
        key = cfg.lastfm_api_key; user = cfg.lastfm_user;
    } catch(e) {
        document.getElementById('now-wrap').innerHTML = '<p class="now-loading">設定が見つかりません。</p>';
    }

    // ── Now Playing ──
    async function loadNowPlaying() {
        const wrap = document.getElementById('now-wrap');
        try {
            const data = await fetch(
                `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(user)}&limit=1&api_key=${key}&format=json`
            ).then(r => r.json());
            const track = data?.recenttracks?.track?.[0];
            if (!track) { wrap.innerHTML = '<p class="now-loading">再生履歴がありません。</p>'; return; }
            const isLive = track['@attr']?.nowplaying === 'true';
            const title  = track.name, artist = track.artist['#text'];
            const lfmImg = track.image?.find(i => i.size === 'large')?.['#text'];
            const artUrl = lfmImg && !lfmImg.includes('2a96cbd8b46e442fc41c2b86b821562f') ? lfmImg : null;
            wrap.innerHTML = `
            <a class="now-card" href="/music/scrobbles/?artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(title)}" target="_blank" rel="noopener">
                ${artUrl
                    ? `<img class="now-art" src="${artUrl}" alt="">`
                    : `<div class="now-art-ph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9 8l6 4-6 4V8z"/></svg></div>`}
                <div class="now-info">
                    <div class="now-track">${title}</div>
                    <div class="now-artist">${artist}</div>
                    <div class="now-status">
                        ${isLive ? `<span class="live-dot"></span>Now Playing` : `Last played`}
                    </div>
                </div>
            </a>`;
        } catch(e) {
            wrap.innerHTML = '<p class="now-loading">取得に失敗しました。</p>';
        }
    }

    // ── Playlists ──
    async function loadPlaylists() {
        const grid = document.getElementById('playlists-grid');
        try {
            const response = await fetch('/playlists/list.json');
            const playlists = await response.json();
            
            grid.innerHTML = playlists.map(pl => `
                <a href="${pl.url}" class="playlist-card" target="_blank" rel="noopener">
                    <div class="playlist-art-wrap">
                        ${pl.artwork 
                            ? `<img src="${pl.artwork}" class="playlist-art" alt="" loading="lazy">`
                            : `<div class="playlist-art" style="background:${pl.color || 'var(--bg2)'}"></div>`}
                    </div>
                    <div class="playlist-content">
                        <div class="playlist-card-title">${pl.title}</div>
                        <div class="playlist-card-desc">${pl.description || ''}</div>
                    </div>
                </a>`).join('');
        } catch(e) {
            grid.innerHTML = '<p class="now-loading\">読み込みに失敗しました。</p>';
        }
    }

    if (key && user) {
        loadNowPlaying();
    }
    loadPlaylists();
})();
</script>
</body>
</html>
