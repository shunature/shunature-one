<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music — Picturebook from shunature</title>
    <meta name="description" content="shunatureが今週聴いている音楽。">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <style>
        .music-wrap { padding: 3.5rem 0 6rem; }

        .music-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 3rem;
        }

        /* ── Now Playing ── */
        .now-section { margin-bottom: 3.5rem; }

        .now-card {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.4rem 1.6rem;
            background: var(--surface);
            border: 1px solid var(--border-mid);
            border-radius: var(--radius);
            max-width: 480px;
        }

        .now-art {
            width: 56px;
            height: 56px;
            border-radius: 2px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg2);
        }
        .now-art-ph {
            width: 56px;
            height: 56px;
            border-radius: 2px;
            background: var(--bg2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: .3;
        }

        .now-info { flex: 1; min-width: 0; }

        .now-track {
            font-size: .95rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: .25rem;
        }
        .now-artist {
            font-size: .78rem;
            color: var(--text-subtle);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-status {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .62rem;
            color: var(--text-subtle);
            margin-top: .4rem;
            opacity: .7;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .4; transform: scale(.7); }
        }

        .now-loading {
            font-size: .8rem;
            color: var(--text-subtle);
            opacity: .5;
            padding: 1rem 0;
        }

        /* ── Weekly ── */
        .weekly-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .weekly-updated {
            font-size: .65rem;
            color: var(--text-subtle);
            opacity: .55;
            font-variant-numeric: tabular-nums;
        }

        .track-list {
            border-top: 1px solid var(--border);
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: .9rem;
            padding: .75rem 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            transition: background .15s;
        }
        .track-item:hover .track-name { color: var(--accent); }

        .track-rank {
            font-size: .68rem;
            color: var(--text-subtle);
            width: 20px;
            text-align: right;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            opacity: .45;
        }

        .track-art {
            width: 36px;
            height: 36px;
            border-radius: 2px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg2);
        }
        .track-art-ph {
            width: 36px;
            height: 36px;
            border-radius: 2px;
            background: var(--bg2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: .25;
        }

        .track-info { flex: 1; min-width: 0; }
        .track-name {
            font-size: .85rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color .2s;
            margin-bottom: .15rem;
        }
        .track-artist {
            font-size: .72rem;
            color: var(--text-subtle);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-plays {
            font-size: .68rem;
            color: var(--text-subtle);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            opacity: .55;
        }

        .track-loading {
            font-size: .8rem;
            color: var(--text-subtle);
            opacity: .5;
            padding: 2rem 0;
        }

        @media (max-width: 640px) {
            .now-card { max-width: 100%; }
        }

        .sc-back {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-size: .75rem;
            color: var(--text-subtle);
            margin-bottom: 2.5rem;
            transition: color .2s;
            letter-spacing: .04em;
        }
        .sc-back:hover { color: var(--accent); }
    </style>
</head>
<body>

<header-module></header-module>

<main>
<div class="music-wrap">
<div class="container">
    
    <a href="/music/" class="sc-back">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Music
    </a>

    <h1 class="music-title">Music</h1>

    <!-- Now Playing -->
    <div class="now-section">
        <p class="section-label">Now Playing</p>
        <div id="now-wrap">
            <p class="now-loading">読み込み中...</p>
        </div>
    </div>

    <!-- Weekly Top 30 -->
    <div class="weekly-section">
        <div class="weekly-header">
            <p class="section-label" style="margin-bottom:0;">This Week</p>
            <span class="weekly-updated" id="weekly-updated"></span>
        </div>
        <div id="track-list">
            <p class="track-loading">読み込み中...</p>
        </div>
    </div>

</div>
</div>
</main>

<script src="/common.js"></script>
<script>
(async function () {
    const LFM_KEY    = 'lfm_tracks_30';
    const LFM_TS_KEY = 'lfm_fetched_at';

    function getLastSunday18() {
        const now = new Date();
        const d   = new Date(now);
        const diff = d.getDay() === 0 ? 0 : d.getDay();
        d.setDate(d.getDate() - diff);
        d.setHours(18, 0, 0, 0);
        if (d > now) d.setDate(d.getDate() - 7);
        return d;
    }

    function shouldRefresh() {
        const ts = localStorage.getItem(LFM_TS_KEY);
        if (!ts) return true;
        return new Date(Number(ts)) < getLastSunday18();
    }

    // last-config.json読み込み
    let key = '', user = '';
    try {
        const cfg = await fetch('/last-config.json').then(r => r.json());
        key  = cfg.lastfm_api_key;
        user = cfg.lastfm_user;
    } catch(e) {
        document.getElementById('now-wrap').innerHTML   = '<p class="now-loading">設定が見つかりません。</p>';
        document.getElementById('track-list').innerHTML = '<p class="track-loading">設定が見つかりません。</p>';
        return;
    }

    // ── Now Playing ──
    async function loadNowPlaying() {
        const wrap = document.getElementById('now-wrap');
        try {
            const data  = await fetch(
                `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(user)}&limit=1&api_key=${key}&format=json`
            ).then(r => r.json());
            const track = data?.recenttracks?.track?.[0];
            if (!track) { wrap.innerHTML = '<p class="now-loading">再生履歴がありません。</p>'; return; }

            const isLive = track['@attr']?.nowplaying === 'true';
            const title  = track.name;
            const artist = track.artist['#text'];
            const lfmImg = track.image?.find(i => i.size === 'large')?.['#text'];
            const artUrl = lfmImg && !lfmImg.includes('2a96cbd8b46e442fc41c2b86b821562f') ? lfmImg : null;

            wrap.innerHTML = `
            <div class="now-card">
                ${artUrl
                    ? `<img class="now-art" src="${artUrl}" alt="">`
                    : `<div class="now-art-ph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9 8l6 4-6 4V8z"/></svg></div>`}
                <div class="now-info">
                    <div class="now-track">${title}</div>
                    <div class="now-artist">${artist}</div>
                    <div class="now-status">
                        ${isLive
                            ? `<span class="live-dot"></span>Now Playing`
                            : `Last played`}
                    </div>
                </div>
            </div>`;
        } catch(e) {
            wrap.innerHTML = '<p class="now-loading">取得に失敗しました。</p>';
        }
    }

    // ── Weekly Top 30 ──
    async function loadWeekly() {
        const listEl   = document.getElementById('track-list');
        const updatedEl = document.getElementById('weekly-updated');

        // キャッシュチェック
        const needRefresh = shouldRefresh();
        const cached      = localStorage.getItem(LFM_KEY);

        let tracks = [];
        if (!needRefresh && cached) {
            tracks = JSON.parse(cached);
            const ts = localStorage.getItem(LFM_TS_KEY);
            if (ts) updatedEl.textContent = new Date(Number(ts)).toLocaleDateString('ja-JP') + ' 更新';
        } else {
            try {
                const data = await fetch(
                    `https://ws.audioscrobbler.com/2.0/?method=user.gettoptracks&user=${encodeURIComponent(user)}&period=7day&limit=30&api_key=${key}&format=json`
                ).then(r => r.json());
                if (data.error || !data.toptracks?.track?.length) {
                    listEl.innerHTML = '<p class="track-loading">データがありません。</p>';
                    return;
                }
                tracks = data.toptracks.track.map(t => ({
                    name:   t.name,
                    artist: t.artist.name,
                    url:    t.url,
                    plays:  parseInt(t.playcount, 10),
                    img:    (() => { const u = t.image?.find(i => i.size === 'medium')?.['#text']; return u && !u.includes('2a96cbd8b46e442fc41c2b86b821562f') ? u : ''; })()
                }));
                const now = Date.now();
                localStorage.setItem(LFM_KEY, JSON.stringify(tracks));
                localStorage.setItem(LFM_TS_KEY, String(now));
                updatedEl.textContent = new Date(now).toLocaleDateString('ja-JP') + ' 更新';
            } catch(e) {
                listEl.innerHTML = '<p class="track-loading">取得に失敗しました。</p>';
                return;
            }
        }

        listEl.innerHTML = `<div class="track-list">${tracks.map((t, i) => `
            <a class="track-item" href="${t.url}" target="_blank" rel="noopener">
                <span class="track-rank">${i + 1}</span>
                ${t.img
                    ? `<img class="track-art" src="${t.img}" alt="" loading="lazy">`
                    : `<div class="track-art-ph"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9 8l6 4-6 4V8z"/></svg></div>`}
                <div class="track-info">
                    <div class="track-name">${t.name}</div>
                    <div class="track-artist">${t.artist}</div>
                </div>
                <span class="track-plays">${t.plays} plays</span>
            </a>`
        ).join('')}</div>`;
    }

    await Promise.all([loadNowPlaying(), loadWeekly()]);
})();
</script>
</body>
</html>
