<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Picturebook from shunature</title>
    <meta name="description" content="ページが見つかりませんでした。">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <style>
        .not-found {
            min-height: calc(100svh - 52px);
            display: flex;
            align-items: center;
            padding: 4rem 0;
        }

        .not-found-inner {
            max-width: 640px;
        }

        .not-found-code {
            font-family: 'Shippori Mincho', serif;
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 400;
            line-height: 1;
            color: var(--border-mid);
            letter-spacing: -.02em;
            user-select: none;
            margin-bottom: -.5rem;
        }

        .not-found-title {
            font-family: 'Shippori Mincho', serif;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 400;
            color: var(--text);
            margin-bottom: .6rem;
        }

        .not-found-desc {
            font-size: .85rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.85;
        }

        .not-found-back {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-size: .78rem;
            color: var(--text-muted);
            border: 1px solid var(--border-mid);
            border-radius: 999px;
            padding: .45rem 1.1rem;
            transition: border-color .2s, color .2s;
            margin-bottom: 3rem;
        }
        .not-found-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .not-found-nav {
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        .not-found-nav-label {
            font-size: .62rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--text-subtle);
            margin-bottom: 1rem;
            opacity: .6;
        }

        .not-found-links {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
        }

        .not-found-link {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-size: .78rem;
            color: var(--text-muted);
            border: 1px solid var(--border-mid);
            border-radius: 999px;
            padding: .38rem .9rem;
            transition: border-color .2s, color .2s;
        }
        .not-found-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>

<header-module></header-module>

<main>
    <div class="not-found">
        <div class="container">
            <div class="not-found-inner">
                <p class="not-found-code">404</p>
                <h1 class="not-found-title">このページは、抜き取られてしまったようです。</h1>
                <p class="not-found-desc">
                    お探しのページは存在しないか、別の場所へ移ってしまいました。<br>
                    URLをご確認いただくか、以下のページからどうぞ。
                </p>
                <a href="/" class="not-found-back">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    最初のページに戻る
                    </a>
            </div>
        </div>
    </div>
</main>

<script src="/common.js"></script>
</body>
</html>
