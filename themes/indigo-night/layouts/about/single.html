{{ define "main" }}
<div class="col">

  <div class="about-page-header">
    <p class="page-eyebrow"><a href="/about/" class="about-breadcrumb">about</a> / {{ .Title | lower }}</p>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="about-page-desc">{{ . }}</p>{{ end }}
  </div>

  <div class="about-subnav">
    <a href="/about/me/"     {{ if eq .File.BaseFileName "me"     }}class="active"{{ end }}>Me</a>
    <a href="/about/links/"  {{ if eq .File.BaseFileName "links"  }}class="active"{{ end }}>Links</a>
    <a href="/about/sonech/" {{ if eq .File.BaseFileName "sonech" }}class="active"{{ end }}>Sonech</a>
  </div>

  <div class="article-body about-body">
    {{ .Content }}
  </div>

</div>
{{ end }}
