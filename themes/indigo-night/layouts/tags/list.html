{{ define "main" }}
<div class="col">

  <div class="blog-header">
    <p class="page-eyebrow">taxonomy</p>
    <h1 class="page-title">Tags</h1>
  </div>

  <div class="tags-index">
    {{ range .Data.Terms.Alphabetical }}
    <a href="{{ .Page.Permalink }}" class="tags-index-item">
      <span class="tags-index-name">{{ .Page.Title }}</span>
      <span class="tags-index-count">{{ .Count }}</span>
    </a>
    {{ end }}
  </div>
  
</div>
{{ end }}
