    <div class="article-body"><p><strong>どうも</strong></p>
<p>本日の内容は以下の通りです</p>
<pre><code>一日ずっと雨で
なんだか気分が
下がってたけど
音について知る
こと出来て良い
</code></pre>
<hr>
<h1 id="解説">解説</h1>
<p>今日も今日とて、音に関する授業だったわけですが、1kHzの音（一般的なのはピー音）をベースに授業が進みまして。</p>
<p>シンセなどで使われる矩形波や、正弦波など出てきてかなり有益な授業だったなと思いました。</p>
