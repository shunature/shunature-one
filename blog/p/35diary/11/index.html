    <div class="article-body"><p><strong>どうも</strong></p>
<p>本日の内容は以下の通りです</p>
<pre><code>気がつけば五月
四月と感じてる
そんな気持ちは
どうなんだろう
いつものことだ
</code></pre>
<hr>
<h1 id="解説">解説</h1>
<p>そう、もう五月なんですよね。</p>
<p>明日からは連休で、世間一般的には「春の大型連休」言うそうな。</p>
<p>帰省するもよし、家でゴロゴロしたり課題をやったりなんかもいいけど、計画してる時が一番楽しいのがいいですよね。</p>
<hr>
<p>では、また明日。</p>
