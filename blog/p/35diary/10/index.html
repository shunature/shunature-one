    <h1 class="article-title">10日目、解説。</h1>
    <div class="article-body"><p><strong>どうも</strong></p>
<p>本日の内容は以下の通りです</p>
<pre><code>四月最後の日に
久々に映画見た
大きな画面で見
るアニメは良い
コナン面白いね
</code></pre>
<hr>
<h1 id="解説">解説</h1>
<p>さて、こっちもコナン仕様です。</p>
<p>学校帰り、経由する駅に映画館があるので寄って帰ってみることに。</p>
<p>ネットで予約をしたのですが、やっぱり便利になったものですね。</p>
<p>わざわざサブスクで見れるのに？と思うかもしれませんが、一つに集中できる映画館って貴重だし、そもそも映画鑑賞自体も貴重だと思ってます。</p>
<p>第一、サブスクの影響で減っていってますし。</p>
<hr>
<p>では、また明日。</p>
<p><strong>摩訶不思議な日常を、僕の視点で。</strong></p>
