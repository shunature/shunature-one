    <h1 class="article-title">満月</h1>
<div class="article-body"><h1 id="ある夜">ある夜</h1>
<p>そう、あれは満月の光がよく見えた夜のこと。</p>
<p>ゲームとか、スマホを見過ぎちゃって寝れなくなっちゃったんですよね。</p>
<p>そういう今もなんですが、なんか <strong>「一人じゃない」</strong> って月を見て思い出すんですよね。</p>
<p>我ながらに <strong>素晴らしいもの</strong> だなとも思っています</p>
<hr>
<p>こんな感じでどうでしょうか？</p>
<p>軽くかける雰囲気がいいなと思うので、楽しいです。</p>
