<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shun "Sqlio" Tonegawa / SQUARE fractal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Zen+Kaku+Gothic+New:wght@300;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #080808;
      --fg: #ffffff;
      --dim: rgba(255,255,255,0.4);
      --faint: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.1);
      --header-bg: rgba(8,8,8,0.9);
      --card-bg: #080808;
      --font-main: 'Zen Kaku Gothic New', sans-serif;
      --font-en: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    :root.light {
      --bg: #f5f5f3;
      --fg: #111111;
      --dim: rgba(0,0,0,0.4);
      --faint: rgba(0,0,0,0.04);
      --border: rgba(0,0,0,0.1);
      --header-bg: rgba(245,245,243,0.9);
      --card-bg: #f5f5f3;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ─── HEADER ─── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 2rem;
      padding: 0 2.5rem;
      height: 52px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-sitename {
      font-family: var(--font-en);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .header-sns {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .header-sns a {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--dim);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .header-sns a:hover { color: var(--fg); }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.7rem;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .theme-toggle:hover { color: var(--fg); border-color: var(--fg); }

    /* ─── MAIN ─── */
    main { padding-top: 52px; }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      padding: 5rem 2.5rem 4rem;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1557683311-eac922347aa1?q=80&w=2629&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      filter: brightness(0.2);
      transition: filter 0.3s;
    }
    .hero-content {
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.55em;
      color: var(--dim);
      text-transform: uppercase;
      display: block;
      margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-family: var(--font-en);
      font-size: clamp(3.5rem, 10vw, 7rem);
      font-weight: 600;
      line-height: 0.93;
    }

    /* ─── SECTION ─── */
    .section {
      padding: 6rem 2.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.5em;
      color: var(--dim);
      text-transform: uppercase;
      display: block;
      margin-bottom: 3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    /* ─── ABOUT ─── */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
    }
    .about-grid h2 {
      font-family: var(--font-en);
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .about-grid p {
      font-size: 0.9rem;
      color: var(--dim);
      font-weight: 300;
      line-height: 1.9;
    }

    /* ─── INTERESTS ─── */
    .interests-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .interest-card {
      background: var(--card-bg);
      padding: 2.5rem;
    }
    .interest-card h3 {
      font-family: var(--font-en);
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .interest-card p {
      font-size: 0.85rem;
      color: var(--dim);
      font-weight: 300;
      line-height: 1.9;
    }

    /* ─── CONTACT ─── */
    .contact-wrap {
      padding: 6rem 2.5rem;
      border-top: 1px solid var(--border);
    }
    .contact-inner {
      max-width: 1100px;
      margin: 0 auto;
    }
    .mail-link {
      font-family: var(--font-en);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 300;
      text-decoration: none;
      color: var(--dim);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .mail-link:hover { color: var(--fg); border-color: var(--fg); }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--dim);
      letter-spacing: 0.06em;
    }
    .photo-credit {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--border);
    }
    .photo-credit a { color: inherit; text-decoration: none; }
    .photo-credit a:hover { color: var(--dim); }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(20px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid #222;
      padding: clamp(2rem,5vw,3.5rem);
      max-width: 520px;
      width: 90%;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1.2rem; right: 1.5rem;
      background: none; border: none;
      color: var(--dim); font-size: 1.5rem;
      cursor: pointer;
    }
    .template-btn {
      width: 100%; text-align: left;
      padding: 1rem 1.2rem;
      background: var(--faint);
      border: 1px solid var(--border);
      color: var(--fg);
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: var(--font-main);
    }
    .template-btn:hover { background: var(--fg); color: var(--bg); }
    .template-btn strong { display: block; font-size: 0.9rem; margin-bottom: 0.2rem; }
    .template-btn small { font-size: 0.75rem; opacity: 0.6; }
    .template-btn:hover small { opacity: 0.7; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      header {
        grid-template-columns: 1fr auto;
        padding: 0 1.2rem;
        gap: 1rem;
      }
      .header-sns { display: none; }
      .hero { padding: 4rem 1.2rem 3rem; }
      .section { padding: 4rem 1.2rem; }
      .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .interests-grid { grid-template-columns: 1fr; }
      .contact-wrap { padding: 4rem 1.2rem; }
      footer { padding: 1.5rem 1.2rem; flex-direction: column; gap: 0.8rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <span class="header-sitename">SQUARE fractal</span>
    <nav class="header-sns">
      <a href="https://mixi.social/@shunature" target="_blank" rel="noopener">mixi2</a>
      <a href="https://www.reddit.com/user/Jealous_Local_550/" target="_blank" rel="noopener">Reddit</a>
      <a href="https://shunature.hateblo.jp/" target="_blank" rel="noopener">はてなブログ</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Light</button>
  </header>

  <main>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <span class="eyebrow">square fractal</span>
        <h1>Shun<br>"Sqlio"<br>Tonegawa</h1>
      </div>
    </section>

    <!-- ABOUT -->
    <div class="section">
      <span class="section-label">About</span>
      <div class="about-grid">
        <div>
          <h2>Profile</h2>
          <p>
            学生 / ベーシスト<br>
            ラジオ業界を目指し、専門学校に在籍中。
          </p>
        </div>
        <div>
          <h2>Interests</h2>
          <div class="interests-grid">
            <div class="interest-card">
              <h3>Sound &amp; Game</h3>
              <p>ラジオ・音楽・ゲーム</p>
            </div>
            <div class="interest-card">
              <h3>Food &amp; Photo</h3>
              <p>PBの烏龍茶<br>写真撮影</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- CONTACT -->
  <div class="contact-wrap">
    <div class="contact-inner">
      <span class="section-label">Contact</span>
      <span class="mail-link" onclick="openModal()">contact[at]ffnet.work</span>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <span class="footer-copy">&copy; 2026 Shun "Sqlio" Tonegawa</span>
    <span class="photo-credit">Photos: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></span>
  </footer>

  <!-- MODAL -->
  <div class="modal-overlay" id="mailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <span class="eyebrow" style="margin-bottom:2rem;">Contact Template</span>
      <button class="template-btn" onclick="sendMail('【サイトについて】')">
        <strong>About this site</strong><small>サイトの感想・不備のご報告</small>
      </button>
      <button class="template-btn" onclick="sendMail('【管理人宛】')">
        <strong>To Administrator</strong><small>私個人へのメッセージ・対話</small>
      </button>
      <button class="template-btn" onclick="sendMail('【重要】')">
        <strong>Urgent</strong><small>至急確認が必要なご連絡</small>
      </button>
      <button class="template-btn" onclick="sendMail('')">
        <strong>Others</strong><small>その他・件名指定なし</small>
      </button>
    </div>
  </div>

  <script>
    const modal = document.getElementById('mailModal');
    function openModal() { modal.style.display = 'flex'; }
    function closeModal() { modal.style.display = 'none'; }
    window.onclick = (e) => { if (e.target === modal) closeModal(); }
    function sendMail(subject) {
      const body = "--%0D%0Aこちらに本文を入力してください。";
      window.location.href = `mailto:contact@ffnet.work?subject=${encodeURIComponent(subject)}&body=${body}`;
      closeModal();
    }

    // Theme toggle
    const btn = document.getElementById('themeToggle');
    const heroBg = document.querySelector('.hero-bg');
    let isLight = false;
    function toggleTheme() {
      isLight = !isLight;
      document.documentElement.classList.toggle('light', isLight);
      btn.textContent = isLight ? 'Dark' : 'Light';
      heroBg.style.filter = isLight ? 'brightness(0.5)' : 'brightness(0.2)';
    }
  </script>
</body>
</html>
